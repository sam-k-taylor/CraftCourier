name: Item not picked up
description: An item in your bags doesn't appear in the CraftCourier mailbox panel.
title: "[Missing item] "
labels: ["item classification"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this! Please run `/ccr item` and shift-click the item into the command, e.g. `/ccr item [Linen Cloth]`, and paste what it prints below.
  - type: textarea
    id: item-info
    attributes:
      label: "/ccr item output"
      description: Paste the full output. It includes the item ID and the details CraftCourier uses to sort it.
      render: text
    validations:
      required: true
  - type: input
    id: expected
    attributes:
      label: Expected category
      description: Which category should this item be in?
      placeholder: e.g. Herbs, BoE Rare
    validations:
      required: true
  - type: dropdown
    id: bound
    attributes:
      label: Is the item soulbound?
      description: CraftCourier never sends bound items.
      options:
        - "No"
        - "Yes"
        - Not sure
  - type: input
    id: version
    attributes:
      label: CraftCourier version
      description: Shown in the AddOns list at character select.
